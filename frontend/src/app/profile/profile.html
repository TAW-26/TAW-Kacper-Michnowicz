<div class="profile-container">
  <div class="profile-grid">

    <aside class="user-info-card">
      <div class="avatar-circle">{{ user.username[0] }}</div>
      <h2>{{ user.username }}</h2>
      <hr>
      <button class="btn-logout" (click)="logout()">Wyloguj się</button>
    </aside>

    <main class="reservations-section">
      <h1>Moje Rezerwacje</h1>

      <div class="res-list" *ngIf="reservations.length > 0; else noRes">
        <div class="res-item" *ngFor="let res of reservations" [class.cancelled]="res.status === 'cancelled'">
          <div class="res-details">
            <h3>{{ res.courtName }}</h3>
            <p><b>Data:</b> {{ res.date }} | <b>Czas:</b> {{ res.time }}</p>
          </div>

          <div class="res-actions">
            <span class="status-badge" [ngClass]="res.status">{{ res.status }}</span>
            <button
              *ngIf="res.status !== 'cancelled'"
              (click)="cancelReservation(res.id)"
              class="btn-cancel">
              Anuluj
            </button>
          </div>
        </div>
      </div>

      <ng-template #noRes>
        <div class="empty-state">
          <p>Nie masz jeszcze żadnych rezerwacji.</p>
          <button routerLink="/" class="btn-primary">Znajdź boisko</button>
        </div>
      </ng-template>
    </main>

  </div>
</div>
