<div class="register-container">
  <div class="register-card">
    <div class="register-header">
      <h2>Stwórz konto</h2>
      <p>Zarejestruj się, aby rezerwować boiska</p>
    </div>

    <div class="error-msg" *ngIf="errorMessage">
      {{ errorMessage }}
    </div>

    <div class="success-msg" *ngIf="successMessage">
      {{ successMessage }}
    </div>

    <form (ngSubmit)="onRegister()" #registerForm="ngForm" *ngIf="!successMessage">

      <div class="form-group">
        <label for="username">Nazwa użytkownika</label>
        <input
          type="text"
          id="username"
          name="username"
          [(ngModel)]="registerData.username"
          required
          #username="ngModel"
          placeholder="Wpisz login">
      </div>

      <div class="form-group">
        <label for="password">Hasło</label>
        <input
          type="password"
          id="password"
          name="password"
          [(ngModel)]="registerData.password"
          required
          minlength="6"
          #password="ngModel"
          placeholder="••••••••">
        <small class="hint-text" *ngIf="password.invalid && password.touched">
          Hasło musi mieć minimum 6 znaków.
        </small>
      </div>

      <button type="submit" class="btn-register" [disabled]="!registerForm.valid || isLoading">
        <span *ngIf="!isLoading">Zarejestruj się</span>
        <span *ngIf="isLoading" class="loader">Wysyłanie...</span>
      </button>
    </form>

    <div class="register-footer">
      <p>Masz już konto? <a routerLink="/login">Zaloguj się</a></p>
    </div>
  </div>
</div>
