<div class="details-container" *ngIf="court$ | async as court; else loading">

  <button class="btn-back" routerLink="/">← Powrót do listy</button>

  <div class="details-grid">
    <section class="info-section">

      <h1>{{ court.name }}</h1>

      <p class="badge" *ngIf="court.status">{{ court.status }}</p>

      <div class="image-container" style="margin-top: 20px;">
        <img
          [src]="court.image || 'https://images.unsplash.com/photo-1508098682722-e99c43a406b2?q=80&w=1200&auto=format&fit=crop'"
          alt="Zdjęcie obiektu: {{ court.name }}"
          class="court-detail-img"
          style="width: 100%; max-width: 600px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1);"
        >
      </div>

    </section>

    <section class="booking-card">
      <h2>Zarezerwuj termin</h2>

      <form (ngSubmit)="onSubmitReservation()" #bookingForm="ngForm">
        <div class="form-group">
          <label>Data</label>
          <input type="date" name="date" [(ngModel)]="reservation.date" required>
        </div>

        <div class="time-grid">
          <div class="form-group">
            <label>Od</label>
            <input type="time" name="start" [(ngModel)]="reservation.startTime" required>
          </div>
          <div class="form-group">
            <label>Do</label>
            <input type="time" name="end" [(ngModel)]="reservation.endTime" required>
          </div>
        </div>

        <button type="submit" class="btn-book" [disabled]="!bookingForm.valid">
          Zarezerwuj teraz
        </button>
      </form>
    </section>
  </div>

</div>

<ng-template #loading>
  <div style="text-align: center; margin-top: 100px; font-size: 18px; color: #7f8c8d;">
    Ładowanie szczegółów obiektu sportowego...
  </div>
</ng-template>
