<div class="details-container">
  <button class="btn-back" routerLink="/">← Powrót do listy</button>

  <div class="details-grid">
    <section class="info-section">
      <div class="image-placeholder"></div>
      <h1>{{ court.name }}</h1>
      <p class="badge">{{ court.type }}</p>

      <div class="description">
        <h3>O obiekcie</h3>
        <p>{{ court.description }}</p>
        <p><strong>Adres:</strong> {{ court.address }}</p>
      </div>
    </section>

    <section class="booking-card">
      <h2>Zarezerwuj termin</h2>
      <p class="price-info">Cena: <strong>{{ court.price }} zł</strong> / godzina</p>

      <form (ngSubmit)="onSubmitReservation()" #bookingForm="ngForm">
        <div class="form-group">
          <label>Data</label>
          <input type="date" name="date" [(ngModel)]="reservation.date" required>
        </div>

        <div class="time-grid">
          <div class="form-group">
            <label>Od</label>
            <input type="time" name="start" [(ngModel)]="reservation.startTime" required>
          </div>
          <div class="form-group">
            <label>Do</label>
            <input type="time" name="end" [(ngModel)]="reservation.endTime" required>
          </div>
        </div>

        <div class="summary" *ngIf="reservation.date && reservation.startTime">
          <p>Podsumowanie: 1h - <strong>{{ court.price }} zł</strong></p>
        </div>

        <button type="submit" class="btn-book" [disabled]="!bookingForm.valid">
          Zarezerwuj teraz
        </button>
      </form>
    </section>
  </div>
</div>
