<div class="login-container">
  <div class="login-card">
    <div class="login-header">
      <h2>Witaj ponownie</h2>
      <p>Zaloguj się, aby rezerwować boiska</p>
    </div>

    <form (ngSubmit)="onLogin()" #loginForm="ngForm">
      <div class="form-group">
        <label for="username">Nazwa użytkownika</label>
        <input
          type="text"
          id="username"
          name="username"
          [(ngModel)]="loginData.username"
          required
          placeholder="Wpisz login">
      </div>

      <div class="form-group">
        <label for="password">Hasło</label>
        <input
          type="password"
          id="password"
          name="password"
          [(ngModel)]="loginData.password"
          required
          placeholder="••••••••">
      </div>

      <div class="error-msg" *ngIf="errorMessage">
        {{ errorMessage }}
      </div>

      <button type="submit" class="btn-login" [disabled]="!loginForm.valid || isLoading">
        <span *ngIf="!isLoading">Zaloguj się</span>
        <span *ngIf="isLoading" class="loader"></span>
      </button>
    </form>

    <div class="login-footer">
      <p>Nie masz konta? <a routerLink="/register">Zarejestruj się</a></p>
    </div>
  </div>
</div>
